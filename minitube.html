<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>MiniTube · 음악과 재생목록</title><style>
:root{color-scheme:dark;font:15px system-ui,sans-serif;background:#101014;color:#f8f8fa}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:#303038;color:#fff}button:hover{background:#484851}input{background:#24242c;border:1px solid #555;color:#fff;border-radius:10px;padding:12px;min-width:0}header{position:sticky;top:0;background:#111116;z-index:3;display:flex;align-items:center;gap:13px;padding:12px 18px;border-bottom:1px solid #333}header strong{font-size:22px;white-space:nowrap;cursor:pointer}header strong b{color:#ff4558}form{display:flex;flex:1;max-width:680px;margin:auto}form input{flex:1;border-radius:22px 0 0 22px}form button{border-radius:0 22px 22px 0}section.layout{display:flex}nav{width:170px;flex-shrink:0;padding:12px 8px;border-right:1px solid #333;min-height:calc(100vh - 70px)}nav button{display:block;width:100%;text-align:left;margin-bottom:7px;background:transparent}nav button.active{background:#3c3c45}main{padding:24px;flex:1;min-width:0}h1{font-size:24px}.muted{color:#aaaab5}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:22px 14px}.grid.shorts{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}.tile{text-align:left;padding:0;background:transparent;width:100%;overflow:hidden}.tile:hover{background:transparent}.tile img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#333}.shorts .tile img{aspect-ratio:9/16}.tile .name{font-weight:650;line-height:1.4;margin-top:7px;overflow-wrap:anywhere}.tile .sub{color:#aaa;font-size:12px;margin-top:3px}.panel{background:#212129;border:1px solid #3d3d49;border-radius:14px;padding:17px;margin:13px 0;line-height:1.65}.error{border-color:#ac4d57;background:#3e252c}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.player{background:#000;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;position:relative;margin-top:14px}.player.short{max-width:400px;aspect-ratio:9/16;margin-left:auto;margin-right:auto}.player iframe,.player video{width:100%;height:100%;border:0}.poster{position:absolute;inset:0;display:grid;place-items:center;background:#15151b}.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}.poster button{z-index:1;background:#f03c51}.channel-avatar{width:85px;height:85px;border-radius:50%;object-fit:cover}.playlist-row{display:flex;align-items:center;gap:13px;width:100%;padding:10px;text-align:left;background:#202026;margin:5px 0}.playlist-row img{width:115px;aspect-ratio:16/9;object-fit:cover;border-radius:8px}.playlist-row span{flex:1;min-width:0;overflow-wrap:anywhere}.action-primary{background:#ef4055}.small{font-size:12px}.divider{border-top:1px solid #41414b;margin:14px 0}@media(max-width:720px){header{flex-wrap:wrap;padding:9px}header strong{font-size:19px}form{order:3;flex-basis:100%;max-width:none}nav{width:100%;display:flex;min-height:0;padding:5px;border-right:0;border-bottom:1px solid #333;overflow-x:auto}nav button{white-space:nowrap;text-align:center;font-size:12px;padding:9px 6px;margin:0}section.layout{display:block}main{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 10px}.grid.shorts{grid-template-columns:repeat(3,minmax(0,1fr))}.tile .name{font-size:13px}}
</style></head><body><header><strong id="logo">▶ <b>Mini</b>Tube</strong><form id="searchForm"><input id="q" placeholder="영상 / 음악 / 재생목록 URL 또는 검색어" required><button>검색</button></form><button id="apiButton">⚙ API</button></header><section class="layout"><nav id="nav"><button data-tab="home">⌂ 홈</button><button data-tab="videos">▣ 영상</button><button data-tab="shorts">▯ 쇼츠</button><button data-tab="music">♫ 음악</button><button data-tab="playlists">☷ 재생목록</button><button data-tab="channels">◉ 채널</button></nav><main id="main"></main></section><script>
'use strict';const $=id=>document.getElementById(id),main=$('main');let key='';try{key=localStorage.getItem('minitube_key')||localStorage.getItem('mt_api_key')||''}catch(e){}const S={tab:'home',query:'',results:[],token:'',channelId:'',channelTitle:'',playlistId:'',playlistTitle:'',entries:[],entryIndex:0,video:null,back:'home',host:'www.youtube-nocookie.com'};
function h(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function msg(t,d,bad=false){return `<div class="panel ${bad?'error':''}"><b>${h(t)}</b><div class="small muted">${h(d)}</div></div>`}function active(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',S.tab===b.dataset.tab))}function switchTab(t){S.tab=t;S.token='';S.results=[];active();if(t==='home')return home();const names={videos:'영상',shorts:'쇼츠',music:'음악',playlists:'재생목록',channels:'채널'};main.innerHTML=`<h1>${names[t]}</h1><div id="results">${msg('검색어를 입력하세요','상단 검색창에서 원하는 콘텐츠를 검색할 수 있습니다.')}</div>`;if(S.query&&key)search()}
async function api(path,p){if(!key)throw Error('API 키가 없습니다. ⚙ API에서 설정하세요.');const r=await fetch('https://www.googleapis.com/youtube/v3/'+path+'?'+new URLSearchParams({...p,key}),{referrerPolicy:'strict-origin-when-cross-origin'});let j=await r.json();if(!r.ok)throw Error((j.error?.errors?.[0]?.reason||'')+' '+(j.error?.message||r.status));return j}
function home(){S.tab='home';active();main.innerHTML=`<h1>MiniTube</h1>${msg('지원 기능','영상, 쇼츠, 음악 검색, 공개 재생목록과 채널 탐색을 지원합니다.')}<div class="row"><button id="keyTest">API 연결 테스트</button><button id="keySet">API 설정</button></div><div id="test"></div><h2>내 영상 파일 재생</h2><input type="file" id="localfile" accept="video/*,audio/*"><div id="localPlayer"></div>`;$('keyTest').onclick=test;$('keySet').onclick=settings;$('localfile').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const u=URL.createObjectURL(f);const holder=$('localPlayer');holder.innerHTML='<video controls playsinline style="display:block;width:100%;max-width:850px;margin:14px 0"></video>';holder.querySelector('video').src=u;}}
function identify(raw){try{const u=new URL(raw),host=u.hostname.replace(/^www\./,'').toLowerCase();if(host==='youtu.be')return {type:'video',id:u.pathname.split('/')[1],list:u.searchParams.get('list')};if(host!=='youtube.com'&&host!=='m.youtube.com')return null;const list=u.searchParams.get('list');if(u.pathname==='/playlist'&&list)return{type:'playlist',id:list};if(u.pathname==='/watch')return list?{type:'playlist',id:list,video:u.searchParams.get('v')}:{type:'video',id:u.searchParams.get('v')};if(u.pathname.startsWith('/shorts/'))return{type:'short',id:u.pathname.split('/')[2]};if(u.pathname.startsWith('/channel/'))return{type:'channel',id:u.pathname.split('/')[2]};if(u.pathname.startsWith('/@'))return{type:'handle',id:u.pathname.split('/')[1].slice(1)};return null}catch(e){return null}}
function item(x){let s=x.snippet||{},kind=x.id?.kind||'',p=kind==='youtube#playlist',c=kind==='youtube#channel',id=p?x.id.playlistId:c?x.id.channelId:x.id?.videoId||x.id,thumb=s.thumbnails?.high?.url||s.thumbnails?.medium?.url||s.thumbnails?.default?.url||'',title=s.title||'제목 없음';return{id,kind:p?'playlist':c?'channel':'video',title,channel:s.channelTitle||'',channelId:s.channelId||'',thumb,short:S.tab==='shorts'}}
function card(x){const badge=x.kind==='playlist'?'☷ 재생목록':x.kind==='channel'?'◉ 채널':x.channel;const thumb=x.thumb||('https://i.ytimg.com/vi/'+encodeURIComponent(x.id)+'/hqdefault.jpg');return `<button class="tile" data-kind="${h(x.kind)}" data-id="${h(x.id)}"><img src="${h(thumb)}" alt="" loading="lazy"><div class="name">${h(x.title)}</div><div class="sub">${h(badge)}</div></button>`}
function renderSearch(){let r=$('results');if(!r)return;r.innerHTML=S.results.length?`<div class="grid ${S.tab==='shorts'?'shorts':''}">${S.results.map(card).join('')}</div>${S.token?'<button id="more" style="margin-top:22px">더 보기</button>':''}`:msg('검색 결과 없음','검색어를 바꿔 주세요.');if($('more'))$('more').onclick=()=>search(true)}
async function search(more=false){let r=$('results');if(!r)return;if(!more){S.token='';S.results=[];r.innerHTML=msg('검색 중','API에서 결과를 가져오는 중입니다.')}try{let p={part:'snippet',q:S.query,maxResults:24,type:S.tab==='channels'?'channel':S.tab==='playlists'?'playlist':'video',safeSearch:'moderate'};if(S.tab==='shorts'){p.q='#shorts '+S.query;p.videoDuration='short'}if(S.tab==='music')p.videoCategoryId='10';if(more&&S.token)p.pageToken=S.token;const j=await api('search',p);const a=(j.items||[]).map(item).filter(x=>x.id);S.results=more?S.results.concat(a):a;S.token=j.nextPageToken||'';renderSearch()}catch(e){r.innerHTML=msg('검색 실패',e.message,true)}}
async function playlist(id){if(!id)return;S.tab='playlist';S.playlistId=id;S.entries=[];S.entryIndex=0;active();main.innerHTML=msg('재생목록 불러오는 중','공개 목록의 정보를 확인하고 있습니다.');try{let p=await api('playlists',{part:'snippet,contentDetails',id});let pl=p.items?.[0];if(!pl)throw Error('공개 재생목록을 찾을 수 없습니다. 비공개 목록은 열 수 없습니다.');S.playlistTitle=pl.snippet.title;main.innerHTML=`<button id="goBack">← 뒤로</button><h1>${h(pl.snippet.title)}</h1><p class="muted">${h(pl.snippet.channelTitle)} · ${pl.contentDetails?.itemCount||0}개 항목</p><div class="row"><button id="playAll" class="action-primary">▶ 처음부터 재생</button></div><div id="entries"></div><div id="loadmore"></div>`;$('goBack').onclick=()=>switchTab('playlists');$('playAll').onclick=()=>{if(S.entries.length)openVideo(S.entries[0].id,false,0)};await loadEntries()}catch(e){main.innerHTML=msg('재생목록 오류',e.message,true)}}
async function loadEntries(token=''){try{let q={part:'snippet',playlistId:S.playlistId,maxResults:50};if(token)q.pageToken=token;let j=await api('playlistItems',q);for(const v of j.items||[]){let s=v.snippet||{},id=s.resourceId?.videoId;if(!id||s.title==='Private video'||s.title==='Deleted video')continue;S.entries.push({id,title:s.title||'영상',channel:s.videoOwnerChannelTitle||s.channelTitle||'',thumb:s.thumbnails?.medium?.url||`https://i.ytimg.com/vi/${id}/hqdefault.jpg`,kind:'video'})}renderEntries();$('loadmore').innerHTML=j.nextPageToken?'<button id="nextEntries">재생목록 더 불러오기</button>':'';if($('nextEntries'))$('nextEntries').onclick=()=>loadEntries(j.nextPageToken)}catch(e){$('loadmore').innerHTML=msg('목록 불러오기 실패',e.message,true)}}
function renderEntries(){let r=$('entries');if(!r)return;r.innerHTML=S.entries.map((x,i)=>`<button class="playlist-row" data-index="${i}"><img src="${h(x.thumb)}" loading="lazy" alt=""><span><b>${i+1}. ${h(x.title)}</b><br><small class="muted">${h(x.channel)}</small></span><span>▶</span></button>`).join('');r.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>openVideo(S.entries[Number(b.dataset.index)].id,false,Number(b.dataset.index)))}
async function channel(id){S.tab='channel';S.channelId=id;active();main.innerHTML=msg('채널 불러오는 중','...');try{let j=await api('channels',{part:'snippet',id}),c=j.items?.[0];if(!c)throw Error('채널을 찾을 수 없습니다.');S.channelTitle=c.snippet.title;main.innerHTML=`<div class="row"><img class="channel-avatar" src="${h(c.snippet.thumbnails?.medium?.url||'')}" alt=""><h1>${h(S.channelTitle)}</h1></div><div class="row"><button id="channelVideos">영상</button><button id="channelPlaylists">재생목록</button></div><div id="channelItems"></div>`;$('channelVideos').onclick=()=>loadChannel('video');$('channelPlaylists').onclick=()=>loadChannel('playlist');loadChannel('video')}catch(e){main.innerHTML=msg('채널 오류',e.message,true)}}
async function loadChannel(type){let r=$('channelItems');r.innerHTML=msg('불러오는 중','...');try{let j=await api('search',{part:'snippet',channelId:S.channelId,type,order:'date',maxResults:40});r.innerHTML='<div class="grid">'+j.items.map(item).filter(x=>x.id).map(card).join('')+'</div>'}catch(e){r.innerHTML=msg('채널 검색 실패',e.message,true)}}
function embed(id){let u=new URL('https://'+S.host+'/embed/'+encodeURIComponent(id));u.searchParams.set('playsinline','1');u.searchParams.set('rel','0');if(['https:','http:'].includes(location.protocol)&&location.origin!=='null')u.searchParams.set('origin',location.origin);return u.href}
function openVideo(id,short=false,index=-1){if(!/^[\w-]{11}$/.test(id))return alert('영상 ID를 확인해 주세요.');if(S.tab!=='watch')S.back=S.tab;S.tab='watch';active();const fromList=index>=0?S.entries[index]:null;let v=fromList||S.results.find(x=>x.id===id)||{};S.entryIndex=index;S.video={id,short,title:v.title||'YouTube 영상',channel:v.channel||'',channelId:v.channelId||'',thumb:v.thumb||`https://i.ytimg.com/vi/${id}/hqdefault.jpg`};renderWatch();if(key)api('videos',{part:'snippet',id}).then(j=>{if(S.video?.id!==id)return;let s=j.items?.[0]?.snippet;if(s){S.video.title=s.title;S.video.channel=s.channelTitle;S.video.channelId=s.channelId;if($('watchTitle'))$('watchTitle').textContent=s.title}}).catch(()=>{})}
function renderWatch(){const v=S.video;main.innerHTML=`<div style="max-width:1000px;margin:auto"><button id="back">← 돌아가기</button><div id="player" class="player ${v.short?'short':''}"></div><div class="row" style="margin-top:12px"><button id="retry">↻ 다시 열기</button><button id="official">YouTube에서 열기</button>${S.entryIndex>=0?'<button id="prev">◀ 이전 곡</button><button id="next">다음 곡 ▶</button>':''}</div><h1 id="watchTitle">${h(v.title)}</h1><p class="muted">${h(v.channel)}</p><div class="row"><button id="visitChannel" ${v.channelId?'':'disabled'}>채널 보기</button></div>${msg('재생이 안 될 경우','오류 153 또는 흰 화면은 iframe 요청의 출처 정보나 현재 브라우저·네트워크 제한 때문일 수 있습니다. GitHub Pages에서도 재생을 보장하지 않습니다.')}</div>`;$('back').onclick=()=>S.back==='playlist'?playlist(S.playlistId):S.back==='channel'?channel(S.channelId):switchTab(S.back==='watch'?'home':S.back);$('retry').onclick=mount;$('official').onclick=()=>window.open('https://www.youtube.com/watch?v='+v.id,'_blank','noopener');$('visitChannel').onclick=()=>channel(S.video.channelId);if($('prev'))$('prev').onclick=()=>{let i=Math.max(0,S.entryIndex-1);openVideo(S.entries[i].id,false,i)};if($('next'))$('next').onclick=()=>{let i=Math.min(S.entries.length-1,S.entryIndex+1);openVideo(S.entries[i].id,false,i)};const b=$('player');b.innerHTML=`<div class="poster"><img src="${h(v.thumb)}" alt=""><button id="play">▶ 영상 재생</button></div>`;$('play').onclick=mount}
function mount(){let b=$('player');if(!b)return;b.replaceChildren();let f=document.createElement('iframe');f.src=embed(S.video.id);f.title='YouTube 동영상';f.allow='accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';b.append(f)}
function settings(){S.tab='settings';active();main.innerHTML=`<h1>API 키 설정</h1>${msg('주의','API 키는 본인 브라우저에만 저장합니다. Google Cloud Console에서 API 키의 웹사이트 및 YouTube Data API v3 사용 제한을 설정하세요.')}<div class="row"><input type="password" id="key" style="flex:1" placeholder="YouTube Data API v3 키" value="${h(key)}"><button id="save">저장</button><button id="testKey">연결 테스트</button></div><div id="test"></div>`;$('save').onclick=()=>{key=$('key').value.trim();try{localStorage.setItem('minitube_key',key);localStorage.setItem('mt_api_key',key)}catch(e){}$('test').innerHTML=msg('저장 완료','연결 테스트를 눌러 주세요.')};$('testKey').onclick=test}
async function test(){if(!$('test'))return;$('test').innerHTML=msg('연결 확인 중','...');try{await api('search',{part:'snippet',q:'music',type:'video',maxResults:1});$('test').innerHTML=msg('API 연결 성공','검색을 사용할 수 있습니다.')}catch(e){$('test').innerHTML=msg('API 오류',e.message,true)}}
$('searchForm').onsubmit=e=>{e.preventDefault();let q=$('q').value.trim();let x=identify(q);if(x){if(x.type==='video'||x.type==='short')return openVideo(x.id,x.type==='short');if(x.type==='playlist')return playlist(x.id);if(x.type==='channel')return channel(x.id);if(x.type==='handle')return api('channels',{part:'snippet',forHandle:x.id}).then(j=>{if(j.items?.[0]?.id)channel(j.items[0].id)}).catch(e=>alert(e.message))}S.query=q;switchTab(['videos','shorts','music','playlists','channels'].includes(S.tab)?S.tab:'videos')};$('nav').onclick=e=>{let b=e.target.closest('[data-tab]');if(b)switchTab(b.dataset.tab)};$('logo').onclick=home;$('apiButton').onclick=settings;main.onclick=e=>{let t=e.target.closest('[data-kind][data-id]');if(!t)return;let k=t.dataset.kind,id=t.dataset.id;if(k==='video')openVideo(id,S.tab==='shorts');if(k==='playlist')playlist(id);if(k==='channel')channel(id)};home();
</script></body></html>
