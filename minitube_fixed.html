<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>MiniTube</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#0e0e10;color:#f5f5f7}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;color:inherit}header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #333;position:sticky;top:0;background:#101014;z-index:2}.brand{font-size:23px;font-weight:900;white-space:nowrap;cursor:pointer}.brand b{color:#ff4558}form{display:flex;flex:1;max-width:700px;margin:auto}input{min-width:0;background:#1c1c22;border:1px solid #484850;color:white;padding:11px;border-radius:12px}form input{flex:1;border-radius:24px 0 0 24px}form button{border-radius:0 24px 24px 0}button{background:#303039;border:0;border-radius:10px;padding:10px 14px}button:hover{background:#42424c}.wrap{display:flex}nav{width:165px;flex-shrink:0;border-right:1px solid #333;padding:16px 8px}nav button{display:block;background:transparent;text-align:left;width:100%;margin-bottom:8px}nav button.active{background:#363640}main{padding:24px;flex:1;min-width:0;max-width:1600px}h1{font-size:23px}.muted,.meta{color:#aaaab6}.meta{font-size:12px;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:20px 14px}.grid.short{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.tile{text-align:left;padding:0;background:transparent;min-width:0}.tile:hover{background:transparent}.thumb{width:100%;aspect-ratio:16/9;border-radius:12px;object-fit:cover;background:#303039}.short .thumb{aspect-ratio:9/16}.name{margin-top:8px;font-weight:650;line-height:1.4;overflow-wrap:anywhere}.panel{background:#202026;border:1px solid #373740;border-radius:15px;padding:18px;margin:16px 0;line-height:1.65}.error{border-color:#a34b53;background:#392329}.flex{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.watch{max-width:1050px;margin:auto}.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:13px;overflow:hidden;margin-top:14px}.player.short{aspect-ratio:9/16;max-width:420px;margin-left:auto;margin-right:auto}.player iframe{width:100%;height:100%;border:0}.channelTop{display:flex;align-items:center;gap:18px;margin:15px 0}.avatar{width:75px;height:75px;border-radius:50%;object-fit:cover}.channelTile{text-align:center;padding:18px;background:#202026;border-radius:15px}.channelTile img{width:90px;height:90px;border-radius:50%;object-fit:cover}.settings{margin-left:auto}.fields{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.fields input{flex:1;min-width:200px}.danger{color:#ff9fa6}.notice{font-size:13px}.tabs button.selected{background:#eaeaea;color:#111}@media(max-width:700px){header{flex-wrap:wrap;padding:10px}.brand{font-size:19px}form{order:3;flex-basis:100%;max-width:none}nav{width:100%;display:flex;border-right:0;border-bottom:1px solid #333;padding:5px}.wrap{display:block}nav button{text-align:center;margin:0;font-size:13px;padding:9px 4px}main{padding:13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 10px}.grid.short{grid-template-columns:repeat(3,minmax(0,1fr))}.name{font-size:13px}}
</style>
</head>
<body>
<header><div class="brand" id="brand">▶ <b>Mini</b>Tube</div><form id="searchForm"><input id="query" placeholder="영상 · 쇼츠 · 채널 검색 또는 URL 붙여넣기" required><button>검색</button></form><button class="settings" id="settingsBtn">⚙ API</button></header>
<div class="wrap"><nav id="nav"><button data-tab="home">⌂ 홈</button><button data-tab="videos">▣ 영상</button><button data-tab="shorts">▯ 쇼츠</button><button data-tab="channels">◉ 채널</button></nav><main id="main"></main></div>
<script>
'use strict';
const main=document.getElementById('main');
const queryInput=document.getElementById('query');
const $=id=>document.getElementById(id);
let apiKey='';
try{apiKey=localStorage.getItem('mt_api_key')||'';}catch(e){}
const state={view:'home',searchType:'videos',term:'',pageToken:'',results:[],channelId:'',channelName:'',channelTab:'videos',video:null,playerHost:'www.youtube.com',back:'home'};
function h(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function msg(title,detail,bad=false){return `<section class="panel ${bad?'error':''}"><strong>${h(title)}</strong><div class="notice">${h(detail)}</div></section>`;}
function nav(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.view));}
function validId(s){return /^[\w-]{11}$/.test(s);}
function parseLink(raw){try{const u=new URL(raw),host=u.hostname.toLowerCase().replace(/^www\./,'');if(host==='youtu.be')return {type:'video',id:u.pathname.slice(1).split('/')[0]};if(host!=='youtube.com'&&host!=='m.youtube.com')return null;if(u.pathname==='/watch')return {type:'video',id:u.searchParams.get('v')};if(u.pathname.startsWith('/shorts/'))return {type:'shorts',id:u.pathname.split('/')[2]};if(u.pathname.startsWith('/live/'))return {type:'video',id:u.pathname.split('/')[2]};if(u.pathname.startsWith('/channel/'))return {type:'channel',id:u.pathname.split('/')[2]};if(u.pathname.startsWith('/@'))return {type:'handle',id:u.pathname.slice(2).split('/')[0]};}catch(e){}return null;}
function errorText(e){const m=String(e.message||e);if(m.includes('API_KEY_INVALID')||m.includes('keyInvalid'))return 'API 키가 올바르지 않습니다. Google Cloud에서 키를 다시 확인하세요.';if(m.includes('accessNotConfigured')||m.includes('SERVICE_DISABLED'))return 'Google Cloud에서 YouTube Data API v3를 사용 설정해야 합니다.';if(m.includes('quotaExceeded')||m.includes('dailyLimitExceeded'))return 'API 일일 할당량을 초과했습니다.';if(m.includes('API_KEY_HTTP_REFERRER_BLOCKED')||m.includes('referer')||m.includes('referrer')||m.includes('PERMISSION_DENIED'))return 'API 키의 웹사이트(HTTP referrer) 제한에 현재 HTML 실행 주소가 허용되지 않았을 수 있습니다. 실행 주소와 키 제한을 확인하세요. 원문: '+m;if(m.includes('Failed to fetch')||m.includes('NetworkError'))return 'API 서버에 연결하지 못했습니다. CodeBeautify 미리보기의 네트워크 정책이나 학교 기기 제한일 수 있습니다. 원문: '+m;return m;}
async function api(endpoint,params={}){if(!apiKey)throw Error('API 키가 없습니다. ⚙ API에서 등록하세요.');const url='https://www.googleapis.com/youtube/v3/'+endpoint+'?'+new URLSearchParams({...params,key:apiKey});let res;try{res=await fetch(url,{method:'GET',mode:'cors',referrerPolicy:'strict-origin-when-cross-origin'});}catch(e){throw Error('Failed to fetch: '+e.message);}let data;try{data=await res.json();}catch(e){throw Error('서버의 응답을 해석할 수 없습니다. HTTP '+res.status);}if(!res.ok)throw Error((data.error?.errors?.[0]?.reason||'')+' '+(data.error?.message||('HTTP '+res.status)));return data;}
function showHome(){state.view='home';nav();main.innerHTML=`<h1>MiniTube</h1>${msg('사용 방법','상단에서 영상·쇼츠·채널을 검색하거나 유튜브 주소를 붙여넣으세요. API 키 설정 후 검색할 수 있습니다.')}<div class="flex"><button id="testApi">API 연결 테스트</button><button id="openApi">API 키 설정</button></div><div id="testResult"></div><p class="muted notice">참고: Google Drive에서 HTML을 저장하거나 미리보는 것과 HTML 웹사이트를 호스팅하는 것은 다릅니다. YouTube 오류 153은 임베드 실행 환경의 출처 정보 문제일 수 있습니다.</p>`;$('testApi').onclick=testApi;$('openApi').onclick=showSettings;}
function switchTab(tab){if(tab==='home')return showHome();state.view=tab;state.searchType=tab;state.pageToken='';state.results=[];nav();renderSearchShell();if(state.term&&apiKey)doSearch();}
function renderSearchShell(){main.innerHTML=`<h1>${{videos:'영상',shorts:'쇼츠',channels:'채널'}[state.view]||'검색'}</h1><div id="results">${msg('검색 대기','검색어를 입력하세요.')}</div>`;}
function card(item){const img=item.thumb||('https://i.ytimg.com/vi/'+encodeURIComponent(item.id)+'/hqdefault.jpg');if(item.isChannel)return `<button class="tile channelTile" data-channel="${h(item.id)}"><img src="${h(img)}" alt="" loading="lazy"><div class="name">${h(item.title)}</div><div class="meta">채널 보기</div></button>`;return `<button class="tile" data-video="${h(item.id)}" data-short="${item.short?'1':'0'}"><img class="thumb" src="${h(img)}" alt="" loading="lazy"><div class="name">${h(item.title)}</div><div class="meta">${h(item.channelName)}</div></button>`;}
function renderItems(){const target=$('results');if(!target)return;target.innerHTML=state.results.length?`<div class="grid ${state.searchType==='shorts'||state.view==='channel'&&state.channelTab==='shorts'?'short':''}">${state.results.map(card).join('')}</div>${state.pageToken?'<p><button id="more">더 보기</button></p>':''}`:msg('검색 결과 없음','다른 키워드로 검색해 보세요.');if($('more'))$('more').onclick=()=>doSearch(true);}
async function doSearch(more=false){const target=$('results');if(!target)return;if(!more){state.results=[];state.pageToken='';target.innerHTML=msg('검색 중','YouTube Data API에 연결하는 중입니다.');}try{const params={part:'snippet',maxResults:20,type:state.view==='channels'?'channel':'video',safeSearch:'moderate'};if(state.view==='channel'){params.channelId=state.channelId;params.type='video';params.order='date';if(state.channelTab==='shorts'){params.q='#shorts';params.videoDuration='short';}}else{params.q=(state.view==='shorts'?'#shorts ':'')+state.term;if(state.view==='shorts')params.videoDuration='short';}if(more&&state.pageToken)params.pageToken=state.pageToken;const data=await api('search',params);const items=(data.items||[]).map(x=>{const s=x.snippet||{};const isChannel=x.id?.kind==='youtube#channel';return {id:isChannel?x.id.channelId:x.id?.videoId,title:s.title||'제목 없음',channelName:s.channelTitle||'',channelId:s.channelId||'',thumb:s.thumbnails?.high?.url||s.thumbnails?.medium?.url||s.thumbnails?.default?.url||'',isChannel,short:state.view==='shorts'||state.view==='channel'&&state.channelTab==='shorts'};}).filter(x=>x.id);state.results=more?[...state.results,...items]:items;state.pageToken=data.nextPageToken||'';renderItems();}catch(e){target.innerHTML=msg('검색 실패',errorText(e),true)+`<p><button id="testApi">API 연결 진단</button></p><div id="testResult"></div>`;$('testApi').onclick=testApi;}}
function openVideo(id,short=false){if(!validId(id)){alert('올바른 YouTube 영상 ID가 아닙니다.');return;}state.back=state.view==='watch'?state.back:state.view;state.view='watch';nav();const found=state.results.find(v=>v.id===id);state.video={id,short:!!short,title:found?.title||'YouTube 영상',channelName:found?.channelName||'',channelId:found?.channelId||''};renderWatch();if(apiKey)api('videos',{part:'snippet',id}).then(data=>{if(state.video?.id!==id)return;const s=data.items?.[0]?.snippet;if(!s)return;state.video.title=s.title;state.video.channelName=s.channelTitle;state.video.channelId=s.channelId;const title=$('videoTitle');if(title)title.textContent=s.title;const channel=$('channelBtn');if(channel)channel.textContent='채널 보기: '+s.channelTitle;}).catch(()=>{});}
function embedUrl(){const id=state.video.id;const u=new URL(`https://${state.playerHost}/embed/${encodeURIComponent(id)}`);u.searchParams.set('playsinline','1');u.searchParams.set('rel','0');if(['https:','http:'].includes(location.protocol)&&location.origin!=='null')u.searchParams.set('origin',location.origin);return u.href;}
function renderWatch(){const v=state.video;main.innerHTML=`<div class="watch"><button id="backBtn">← 돌아가기</button><div class="player ${v.short?'short':''}" id="player"></div><div class="flex" style="margin-top:12px"><button id="retryBtn">↻ 재시도</button><button id="normalBtn">일반 플레이어</button><button id="privacyBtn">개인정보 보호 플레이어</button><button id="youtubeBtn">유튜브에서 열기</button></div><h1 id="videoTitle">${h(v.title)}</h1><button id="channelBtn" ${v.channelId?'':'disabled'}>채널 보기${v.channelName?': '+h(v.channelName):''}</button>${msg('재생 오류 안내','오류 153은 주로 플레이어 출처 식별 정보가 없을 때 발생합니다. HTML 편집기 미리보기나 학교 기기 정책으로 인한 제한은 이 코드만으로 해결되지 않을 수 있습니다.')}</div>`;$('backBtn').onclick=()=>{if(state.back==='channel')return openChannel(state.channelId);switchTab(['videos','shorts','channels'].includes(state.back)?state.back:'home');};$('retryBtn').onclick=mountPlayer;$('normalBtn').onclick=()=>{state.playerHost='www.youtube.com';mountPlayer();};$('privacyBtn').onclick=()=>{state.playerHost='www.youtube-nocookie.com';mountPlayer();};$('youtubeBtn').onclick=()=>window.open((v.short?'https://www.youtube.com/shorts/':'https://www.youtube.com/watch?v=')+v.id,'_blank','noopener,noreferrer');$('channelBtn').onclick=()=>state.video.channelId&&openChannel(state.video.channelId);mountPlayer();}
function mountPlayer(){const p=$('player');if(!p)return;p.replaceChildren();const frame=document.createElement('iframe');frame.src=embedUrl();frame.title='YouTube 플레이어';frame.allow='accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';p.append(frame);}
async function openChannel(id){state.view='channel';state.channelId=id;state.channelTab='videos';state.searchType='videos';state.results=[];main.innerHTML=msg('채널 로딩 중','채널 정보를 불러오고 있습니다.');try{const data=await api('channels',{part:'snippet',id});const c=data.items?.[0];if(!c)throw Error('채널을 찾지 못했습니다.');state.channelName=c.snippet.title;main.innerHTML=`<div class="channelTop"><img class="avatar" src="${h(c.snippet.thumbnails?.high?.url||'')}" alt=""><h1>${h(c.snippet.title)}</h1></div><div class="flex tabs"><button data-ct="videos" class="selected">영상</button><button data-ct="shorts">쇼츠</button></div><div id="results"></div>`;document.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>{state.channelTab=b.dataset.ct;state.searchType=state.channelTab;document.querySelectorAll('[data-ct]').forEach(x=>x.classList.toggle('selected',x===b));doSearch();});doSearch();}catch(e){main.innerHTML=msg('채널 열기 실패',errorText(e),true);}}
async function openHandle(handle){try{const data=await api('channels',{part:'snippet',forHandle:handle});const id=data.items?.[0]?.id;if(!id)throw Error('채널을 찾지 못했습니다.');openChannel(id);}catch(e){main.innerHTML=msg('채널 주소 오류',errorText(e),true);}}
function showSettings(){state.view='settings';nav();main.innerHTML=`<h1>API 설정 · 연결 진단</h1>${msg('API 키 보관 안내','키는 현재 브라우저의 로컬 저장소에 보관됩니다. 공개 HTML에 키를 직접 적어 넣지 마세요. 배포할 때는 Google Cloud에서 키의 웹사이트 제한과 API 제한을 설정하세요.')}<div class="fields"><input id="apiInput" type="password" autocomplete="off" placeholder="YouTube Data API v3 키" value="${h(apiKey)}"><button id="saveBtn">저장</button><button id="clearBtn">삭제</button></div><div class="flex"><button id="testApi">API 연결 테스트</button></div><div id="testResult"></div>${msg('검색이 막히는 경우','YouTube Data API v3 활성화 여부, API 키의 HTTP referrer 제한, API 사용량, 현재 HTML 실행 사이트의 보안 정책을 확인해 주세요.')}`;$('saveBtn').onclick=()=>{apiKey=$('apiInput').value.trim();try{localStorage.setItem('mt_api_key',apiKey);}catch(e){}$('testResult').innerHTML=msg('저장 완료','현재 브라우저에 키를 저장했습니다. 연결 테스트를 눌러 확인하세요.');};$('clearBtn').onclick=()=>{apiKey='';$('apiInput').value='';try{localStorage.removeItem('mt_api_key');}catch(e){}$('testResult').innerHTML=msg('삭제 완료','저장된 API 키를 지웠습니다.');};$('testApi').onclick=testApi;}
async function testApi(){const el=$('testResult');if(!el)return;el.innerHTML=msg('API 확인 중','Google API 서버에 시험 요청을 보냅니다.');try{const data=await api('search',{part:'snippet',q:'Minecraft',type:'video',maxResults:1});el.innerHTML=msg('연결 성공','API가 응답했습니다. 검색 결과 '+(data.items?.length||0)+'개를 수신했습니다.');}catch(e){el.innerHTML=msg('연결 실패',errorText(e),true);}}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();const q=queryInput.value.trim();if(!q)return;const link=parseLink(q);if(link){if(['video','shorts'].includes(link.type))return openVideo(link.id,link.type==='shorts');if(link.type==='channel')return openChannel(link.id);if(link.type==='handle')return openHandle(link.id);}state.term=q;switchTab(['videos','shorts','channels'].includes(state.view)?state.view:'videos');});
$('settingsBtn').onclick=showSettings;$('brand').onclick=showHome;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));main.addEventListener('click',e=>{const t=e.target.closest('[data-video],[data-channel]');if(!t)return;if(t.dataset.video)openVideo(t.dataset.video,t.dataset.short==='1');else if(t.dataset.channel)openChannel(t.dataset.channel);});showHome();
</script>
</body></html>
